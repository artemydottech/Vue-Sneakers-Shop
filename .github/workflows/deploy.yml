name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn build

      - name: Publish dist to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add ../pages -B gh-pages origin/gh-pages
          find ../pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r dist/. ../pages/
          cd ../pages
          git add -A
          if git diff --staged --quiet; then
            echo "Сборка не изменилась, публиковать нечего"
            exit 0
          fi
          git commit -m "deploy ${GITHUB_SHA::7}"
          git push origin gh-pages
